name: Pages

# The site is deployed from here, not from the branch. Deploying a branch
# root serves every file in the repository as a public URL - package.json,
# the test suites, the build script - which is not what a website is. This
# assembles exactly the files the two pages need and ships only those.
#
# Nothing is built: the pages import index.js off disk on purpose, so what
# the site runs is the source that was reviewed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the site
        run: |
          mkdir -p site/docs
          cp index.html index.js og.png llms.txt site/
          cp docs/index.html site/docs/
          test -f CNAME && cp CNAME site/
          find site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
