name: Pages

# The site lives in site/ and is deployed from here, not from a branch.
# Library code and site code stay apart: site/ has the two pages, the card,
# llms.txt and the domain file, and nothing else in the repository becomes
# a public URL. index.js is copied in at deploy time - the pages import it
# off disk on purpose, so what the site runs is the source that was
# reviewed. Locally, `npm run site` does the same with a symlink.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Put the library beside the pages
        run: |
          cp index.js site/index.js
          find site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
