<!doctype html>
<!--
  The social card. This page exists to be screenshotted, and og.png next to it
  is the result: 1200x630, which is what Twitter, Slack, iMessage and GitHub
  all want. The pill in it is the real library showing on a real trigger - the
  cursor is the only thing drawn.

  Regenerate after a design change (`npm run site` first, it serves site/):

    node -e "
    const {chromium}=require('playwright-core');
    (async()=>{const b=await chromium.launch();
    const p=await b.newPage({viewport:{width:1200,height:630},deviceScaleFactor:2});
    await p.goto('http://localhost:8000/og.html',{waitUntil:'networkidle'});
    await p.evaluate(()=>document.fonts.ready);
    await p.mouse.move(668,372); await p.waitForTimeout(400);
    await p.screenshot({path:'og.png'}); await b.close();})()"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og</title>
<!-- Inter, the same cut hah.to uses. The site itself runs on system fonts; a
     PNG cannot, and the box that renders this one only has DejaVu. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=block">
<style>
:root{
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --tip-font-family: var(--sans);
  --tip-max-width: 460px;          /* one line on the card */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #fcfcfc; --fg: #0f1116; --fg-2: #575d66; --fg-3: #888e98;
  --line: rgb(16 18 24 / .10);
}
html,body{ margin:0; width:1200px; height:630px; overflow:hidden }
body{
  background:var(--bg); color:var(--fg); font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased; position:relative;
}
.card{ position:absolute; inset:0; padding:76px 84px; display:flex; flex-direction:column }

/* the mark, with the chromatic fringe held at rest - see index.html */
.mark{ position:relative; display:inline-flex; width:max-content }
.mark svg{ display:block; height:32px; width:auto }
.mark .l{ position:absolute; left:0; top:0; opacity:.9 }
.mark .l1{ color:#3a86ff; transform:translate(-2.5px,1px) }
.mark .l2{ color:#8338ec; transform:translate(1px,-2.2px) skewX(4deg) }
.mark .l3{ color:#ff006e; transform:translate(3px,.8px) }
.mark .l4{ color:#ffbe0b; transform:translate(-.8px,2.5px) }
.mark .t{ position:relative; z-index:1 }

h1{
  margin:42px 0 0; font-size:82px; line-height:1.02; letter-spacing:-.042em;
  font-weight:600; max-width:12ch;
}
.lead{ margin:22px 0 0; font-size:28px; line-height:1.35; color:var(--fg-2); max-width:24ch }

/* the trigger is the whole lower-right quarter: the pill rides wherever the
   cursor is, so the trigger just has to be under it */
.stage{ position:absolute; left:560px; top:250px; right:0; bottom:0 }

.install{
  margin-top:auto; font-family:var(--mono); font-size:22px; color:var(--fg-3);
  letter-spacing:-.01em;
}
.install b{ color:var(--fg); font-weight:500 }

/* the drawn cursor, tip at (0,0) of its box */
.cursor{ position:absolute; left:668px; top:372px; width:26px; height:34px; z-index:10000; pointer-events:none }
</style>
</head>
<body>

<div class="card">
  <span class="mark" aria-hidden="true">
    <svg class="l l1" viewBox="0 0 340 100"><rect width="100" height="100" rx="6" fill="currentColor"/><polygon points="170,4 226,96 114,96" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><rect x="240" width="100" height="100" rx="6" fill="currentColor"/></svg>
    <svg class="l l2" viewBox="0 0 340 100"><rect width="100" height="100" rx="6" fill="currentColor"/><polygon points="170,4 226,96 114,96" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><rect x="240" width="100" height="100" rx="6" fill="currentColor"/></svg>
    <svg class="l l3" viewBox="0 0 340 100"><rect width="100" height="100" rx="6" fill="currentColor"/><polygon points="170,4 226,96 114,96" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><rect x="240" width="100" height="100" rx="6" fill="currentColor"/></svg>
    <svg class="l l4" viewBox="0 0 340 100"><rect width="100" height="100" rx="6" fill="currentColor"/><polygon points="170,4 226,96 114,96" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><rect x="240" width="100" height="100" rx="6" fill="currentColor"/></svg>
    <svg class="t" viewBox="0 0 340 100"><rect width="100" height="100" rx="6" fill="currentColor"/><polygon points="170,4 226,96 114,96" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><rect x="240" width="100" height="100" rx="6" fill="currentColor"/></svg>
  </span>

  <h1>A tooltip with personality</h1>
  <p class="lead">Follows the cursor and adds just a bit of magic to any app.</p>

  <p class="install"><b>npm i @extramoose/tooltip</b> &nbsp;·&nbsp; no dependencies &nbsp;·&nbsp; 4.8 kB</p>
</div>

<div class="stage" data-tip="Rides the cursor, and never runs off the edge." data-tip-pos="right"></div>

<svg class="cursor" viewBox="0 0 26 34" aria-hidden="true">
  <path d="M2 2l0 25 6-6 4.5 10 4.5-2-4.5-9.5H20z" fill="#0f1116" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>

<script type="module">
  import createTooltip from './index.js';
  createTooltip({ offset: { x: 18, y: 26 } });
</script>
</body>
</html>
